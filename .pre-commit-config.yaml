# prek / pre-commit hooks for fast, commit-sized checks.
# Install once with `prek install`; run everything with `prek run --all-files`.
# Tests stay in `just test` and CI; this file intentionally does not run `cargo test`.
#
# `repo: builtin` is a prek extension. Install prek:
# https://github.com/j178/prek#installation
#
# The cargo hooks mirror this repository's own `just lint` gate, so the hook is
# always a subset of the gate. `rustup run <toolchain> cargo ...` pins the
# toolchain explicitly instead of relying on the PATH order of `cargo`.

priorities:
  fix: 0
  checks: 10
  lint: 20
  compile: 30

repos:
  - repo: builtin
    hooks:
      # Mutating hooks run first, one priority apart, so they never edit the
      # same file concurrently.
      - id: trailing-whitespace
        priority: fix
      - id: end-of-file-fixer
        priority: 1

      # Read-only repository hygiene checks.
      - id: check-added-large-files
        args: [--maxkb=1024]
        priority: checks
      - id: check-case-conflict
        priority: checks
      - id: check-illegal-windows-names
        priority: checks
      - id: check-merge-conflict
        priority: checks
      - id: check-symlinks
        priority: checks
      - id: check-yaml
        priority: checks
      - id: check-toml
        priority: checks
      - id: check-json
        priority: checks
      # `detect-private-key` is not hooked here: this repository
      # intentionally tracks PEM material (test fixtures and marker
      # constants). Kingfisher still scans those files against an
      # exact allowlist.

  # Secret scanning: blocks staged API keys, tokens, and credentials.
  # The first run downloads and caches the pinned Kingfisher binary.
  - repo: https://github.com/mongodb/kingfisher
    rev: v2.20.0
    hooks:
      - id: kingfisher-auto-files
        args: ['--no-validate', '--redact', '--skip-regex', 'BEGIN PRIVATE KEY-----",[^"]*"-----BEGIN RSA PRIVATE KEY', '--skip-regex', 'MIIEowIBAAKCAQEApvaDbFZ9bQLYfvJiX73va', '--skip-regex', 'MIIEowIBAAKCAQEApvaDbFZ9bQLYfvJiX73vaN9Id9s37NiyPw8acjqXF9S2rGyB', '--skip-regex', 'MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSk', '--skip-regex', 'MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDwowZPFdWJcgBr', '--skip-regex', 'MIIEvwIBADANBgkqhkiG9w0BAQEFAASCBKkwggSl', '--skip-regex', 'MIIEvwIBADANBgkqhkiG9w0BAQEFAASCBKkwggSlAgEAAoIBAQDW9ocDwFQhfdNA', '--skip-regex', 'http://Aladdin:opensesame@proxy\.local:8080', '--skip-regex', 'http://Aladdin:opensesame@y\.ep', '--skip-regex', 'http://admin:secret@proxy\.local:8080', '--skip-regex', 'http://letme:in@yo\.local', '--skip-regex', 'http://user%40domain:p%40ss%3Aword@proxy\.local', '--skip-regex', 'http://user%40domain:p%40ss@proxy\.local:8080', '--skip-regex', 'http://user:pass@proxy:8080', '--skip-regex', 'http://user:pass@proxy\.local:8080', '--skip-regex', 'http://user:s3cret@127\.0\.0\.1:9', '--skip-regex', 'http://user:s3cret@proxy:8080', '--skip-regex', 'http://user:secret@127\.0\.0\.1:8080', '--skip-regex', 'http://user:secret@\[::1\]:8080', '--skip-regex', 'http://user:secret@host:8080', '--skip-regex', 'http://user:secret@proxy-a:8080', '--skip-regex', 'http://user:secret@proxy\.local:8080', '--skip-regex', 'https://admin:secret@proxy\.local:3128', '--skip-regex', 'https://letme:in@yo\.local', '']
        env:
          KINGFISHER_VERSION: v2.20.0
        priority: checks

  - repo: local
    hooks:
      # `typos` is not hooked here: the `typos` check is already red, so
      # the hook would block commits that the gate itself still allows.
      # Fix the gate first, then enable this hook.
      - id: rumdl
        name: rumdl
        language: system
        entry: rumdl check .
        files: \.md$
        pass_filenames: false
        priority: lint

      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: rustup run nightly-2026-11-06 cargo fmt --all -- --check
        files: \.rs$
        pass_filenames: false
        priority: lint

      - id: cargo-sort
        name: cargo sort
        language: system
        entry: cargo sort --workspace --grouped --check
        files: (^|/)Cargo\.toml$
        pass_filenames: false
        priority: 21

      # `cargo clippy` is not hooked here yet: the gate has not been verified green
      # in this workspace. Run `prek run cargo-clippy --all-files` once, fix what it
      # reports, then enable this hook. Enabling it now could block every commit.
