[package]
name = "hpx-streams"
version.workspace = true
description = "HTTP response streaming support for hpx: JSON/CSV/Protobuf/Arrow"
keywords = ["http", "stream", "json", "csv", "protobuf"]
categories = ["asynchronous", "network-programming", "web-programming"]
repository.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
arrow = ["dep:arrow", "dep:bytes", "dep:tokio-util", "dep:hpx", "hpx/stream"]
# Enable zero-copy, on-demand JSON frame access via the simd-json tape.
# Deliberately independent from `simd-json` so callers that only need a
# borrowed view do not pull in the full streaming codec stack.
# Not part of the `hft`/`stealth` presets: those are `hpx` crate presets and
# `hpx` does not depend on `hpx-streams`, so this is enabled per consumer.
borrowed-json = ["dep:simd-json"]
csv = ["dep:csv", "dep:serde", "dep:bytes", "dep:tokio-util", "dep:hpx", "hpx/stream"]
default = []
hotpath = ["dep:hotpath"]
json = ["dep:serde", "dep:serde_json", "dep:bytes", "dep:hpx", "hpx/json", "hpx/stream", "dep:tokio-util"]
protobuf = ["dep:prost", "dep:bytes", "dep:tokio-util", "dep:hpx", "hpx/stream"]
# Enable zero-copy FIX SBE streaming (length-prefixed envelopes).
# Not part of `hft`/`stealth`: those are `hpx` presets and `hpx` does not
# depend on `hpx-streams`; this is enabled per consumer.
sbe = ["dep:bytes", "dep:hpx", "hpx/stream", "dep:tokio-util"]
# Enable SIMD-accelerated JSON parsing (requires json feature).
simd-json = ["json", "dep:simd-json"]

[dependencies]
arrow = { workspace = true, optional = true, features = ["ipc", "arrow-ipc"] }
bytes = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
futures = { workspace = true }
hotpath = { workspace = true, optional = true }
hpx = { workspace = true, optional = true, features = ["stream"] }
prost = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
simd-json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio-util = { workspace = true, optional = true, features = ["io", "codec"] }

[dev-dependencies]
# The integration suite drives the real `hpx::Client` against a loopback server
# so the codecs are exercised end to end, including the incremental paths that
# only appear when a body arrives in several TCP segments.
arrow = { workspace = true, features = ["ipc", "arrow-ipc"] }
bytes = { workspace = true }
csv = { workspace = true }
futures = { workspace = true }
hpx = { workspace = true, features = ["stream"] }
proptest = { workspace = true }
prost = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
